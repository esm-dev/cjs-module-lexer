[workspace]
members = ["native", "lexer", "wasm"]
resolver = "2"

[workspace.dependencies]
lexer = { path = "lexer" }
bytes-str = "0.2.9"
indexmap = "2.14.2"
oxc_resolver = "11.24.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-wasm-bindgen = "0.6.5"
swc_common = "26.0.0"
swc_ecmascript = { version = "74.0.0", features = ["parser"] }
wasm-bindgen = { version = "0.2.129", features = ["serde-serialize"] }

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.release.package.wasm]
# optimization for size (more aggressive)
opt-level = "z"
